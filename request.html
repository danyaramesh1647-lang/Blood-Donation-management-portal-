<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blood Donation Portal - Request Blood</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">🩸 BloodConnect</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="donors.html">Donors</a></li>
      <li><a href="register.html">Register</a></li>
      <li><a href="request.html" class="active">Request Blood</a></li>
      <li><a href="availability.html">Availability</a></li>
      <li><a href="camps.html">Camps</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Emergency Blood Request</h1>
  <form id="request-form">
    <div class="form-group">
      <label for="req-patient">Patient Name</label>
      <input type="text" id="req-patient" required>
    </div>
    <div class="form-group">
      <label for="req-blood">Blood Group Needed</label>
      <select id="req-blood" required>
        <option value="">Select</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
    </div>
    <div class="form-group">
      <label for="req-units">Units Required</label>
      <input type="number" id="req-units" min="1" required>
    </div>
    <div class="form-group">
      <label for="req-hospital">Hospital Name</label>
      <input type="text" id="req-hospital" required>
    </div>
    <div class="form-group">
      <label for="req-contact">Contact Number</label>
      <input type="tel" id="req-contact" placeholder="10-digit number" required>
    </div>
    <button type="submit" class="btn btn-primary">Submit Request</button>
    <div id="request-status" class="status-msg"></div>
  </form>
</main>

<footer>&copy; 2026 BloodConnect. All rights reserved.</footer>
<script src="js/script.js"></script>
</body>
</html>
