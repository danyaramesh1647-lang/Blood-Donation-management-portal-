<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Blood Donation Portal - Register</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">🩸 BloodConnect</div>
  <nav>
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="donors.html">Donors</a></li>
      <li><a href="register.html" class="active">Register</a></li>
      <li><a href="request.html">Request Blood</a></li>
      <li><a href="availability.html">Availability</a></li>
      <li><a href="camps.html">Camps</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
  </nav>
</header>

<main>
  <h1>Register as a Donor</h1>
  <form id="register-form">
    <div class="form-group">
      <label for="reg-name">Full Name</label>
      <input type="text" id="reg-name" required>
    </div>
    <div class="form-group">
      <label for="reg-blood">Blood Group</label>
      <select id="reg-blood" required>
        <option value="">Select</option>
        <option value="O+">O+</option>
        <option value="O-">O-</option>
        <option value="A+">A+</option>
        <option value="A-">A-</option>
        <option value="B+">B+</option>
        <option value="B-">B-</option>
        <option value="AB+">AB+</option>
        <option value="AB-">AB-</option>
      </select>
    </div>
    <div class="form-group">
      <label for="reg-city">City</label>
      <input type="text" id="reg-city" required>
    </div>
    <div class="form-group">
      <label for="reg-phone">Phone Number</label>
      <input type="tel" id="reg-phone" placeholder="10-digit number" required>
    </div>
    <button type="submit" class="btn btn-primary">Register</button>
    <div id="register-status" class="status-msg"></div>
  </form>
</main>

<footer>&copy; 2026 BloodConnect. All rights reserved.</footer>
<script src="js/script.js"></script>
</body>
</html>
